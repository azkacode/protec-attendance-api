services:
  attendance-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ATTENDANCE_API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DBHOST: ${ATTENDANCE_DBHOST:-host.docker.internal}
      REDISURL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
